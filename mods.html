<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مودات سيرفر علم كرافت</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/OIG1.png">
</head>
<body class="dark-theme">
<div id="scroll-progress"></div>
<div id="toast"></div>
<button class="hamburger" onclick="toggleMenu()">☰</button>
<nav class="side-menu" id="sideMenu">
<a href="index.html">🏠 الصفحة الرئيسية</a>
<a href="#mods">⚙️ المودات</a>
</nav>
<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="container">
<header class="hero">
<img src="images/logo.webp" class="logo" draggable="false">
<h1>⚙️ مودات سيرفر علم كرافت</h1>
<p>جميع مودات وإضافات السيرفر مع شرح لكل مود.</p>
</header>
<section class="mods-page" id="mods">
<div id="mods-container"></div>
</section>
<footer class="footer">
<p>© 2026 AlamCraft Server</p>
</footer>
</div>
<script>
const mods=[
{nameAr:"مود اصلاح السندان",nameEn:"AnvilUnlocker",icon:"images/mods/anvilunlocker.webp",descAr:"يسمح بإصلاح الأدوات داخل السندان بدون قيود.",descEn:"Allows repairing items without vanilla limits.",video:""},
{nameAr:"مود نظام المهارات",nameEn:"AuraSkills",icon:"images/mods/auraskills.webp",descAr:"يضيف نظام مهارات ومستويات للاعبين.",descEn:"Adds RPG skills and leveling.",video:""},
{nameAr:"مود تسجيل الدخول",nameEn:"AuthMe",icon:"images/mods/authme.webp",descAr:"يحمي حساب اللاعب بكلمة مرور.",descEn:"Protects player accounts with passwords.",video:""},
{nameAr:"مود المقايدة",nameEn:"AxTrade",icon:"images/mods/axtrade.webp",descAr:"يسمح بالمقايضة الآمنة بين اللاعبين.",descEn:"Safe player trading system.",video:""},
{nameAr:"مود الخزنات الخاصة",nameEn:"AxVaults",icon:"images/mods/axvaults.webp",descAr:"خزنات إضافية لحفظ الأغراض.",descEn:"Extra personal storage vaults.",video:""},
{nameAr:"مود إدارة الدردشة",nameEn:"ChatManager",icon:"images/mods/chatmanager.webp",descAr:"تنظيم وإدارة دردشة السيرفر.",descEn:"Advanced chat management.",video:""},
{nameAr:"مود تنظيف اللاج",nameEn:"ClearLag",icon:"images/mods/clearlag.webp",descAr:"يحسن الأداء ويقلل اللاج.",descEn:"Reduces lag and improves performance.",video:""},
{nameAr:"مود حمل الموبات",nameEn:"ClickMobs",icon:"images/mods/clickmobs.webp",descAr:"يمكنك حمل بعض المخلوقات.",descEn:"Carry mobs by clicking them.",video:""},
{nameAr:"مود ربط الديسكورد",nameEn:"DiscordSRV",icon:"images/mods/discordsrv.webp",descAr:"يربط شات السيرفر بالديسكورد.",descEn:"Links Minecraft chat with Discord.",video:""},
{nameAr:"مود الرؤوس",nameEn:"DropHeads",icon:"images/mods/dropheads.webp",descAr:"إسقاط رؤوس اللاعبين والموبات.",descEn:"Players and mobs can drop heads.",video:""},
{nameAr:"مود الإضاءة",nameEn:"DynamicLights",icon:"images/mods/dynamiclights.webp",descAr:"يجعل الأدوات المضيئة تنير المكان أثناء حملها.",descEn:"Light-emitting items illuminate while held.",video:""},
{nameAr:"مود الشوب",nameEn:"EconomyShopGUI",icon:"images/mods/economyshopgui.webp",descAr:"متجر متكامل للبيع والشراء.",descEn:"GUI shop for buying and selling.",video:""},
{nameAr:"مود الأوامر الأساسية",nameEn:"Essentials",icon:"images/mods/essentials.webp",descAr:"يوفر أهم أوامر السيرفر الأساسية.",descEn:"Provides essential server commands.",video:""},
{nameAr:"مود النقل للسباون",nameEn:"EssentialsSpawn",icon:"images/mods/essentialsspawn.webp",descAr:"ينقلك إلى نقطة السباون.",descEn:"Teleports players to spawn.",video:""},
{nameAr:"مود حماية المزارع",nameEn:"FarmProtection",icon:"images/mods/farmprotection.webp",descAr:"يحمي المزارع من التلف.",descEn:"Protects farms from grief.",video:""},
{nameAr:"مود دعم البيدروك",nameEn:"GeyserMC",icon:"images/mods/geyser.webp",descAr:"يسمح للاعبي بيدروك بالدخول.",descEn:"Allows Bedrock players to join.",video:""},
{nameAr:"مود حماية الأراضي",nameEn:"GriefPrevention",icon:"images/mods/griefprevention.webp",descAr:"يحمي الأراضي من السرقة والتخريب.",descEn:"Land claiming and protection.",video:""},
{nameAr:"مود الجلوس",nameEn:"GSit",icon:"images/mods/gsit.webp",descAr:"يمكنك الجلوس والاستلقاء.",descEn:"Sit and lay anywhere.",video:""},
{nameAr:"مود طلب التي بي",nameEn:"JustTPA",icon:"images/mods/justtpa.webp",descAr:"طلبات انتقال بين اللاعبين.",descEn:"Simple teleport request system.",video:""},
{nameAr:"مود إدارة الصلاحيات",nameEn:"LuckPerms",icon:"images/mods/luckperms.webp",descAr:"إدارة الرتب والصلاحيات.",descEn:"Advanced permissions manager.",video:""},
{nameAr:"مود البيع بسعر مخصص",nameEn:"NexusAuctionHouse",icon:"images/mods/nexusauctionhouse.webp",descAr:"بيع وشراء بين اللاعبين بالمزاد.",descEn:"Auction House for players.",video:""},
{nameAr:"مود تخطي الليل بلاعب واحد",nameEn:"OnePlayerSleep",icon:"images/mods/oneplayersleep.webp",descAr:"يتخطى الليل بنوم لاعب واحد.",descEn:"Skip the night with one player.",video:""},
{nameAr:"مود منع استخدام الاكس راي",nameEn:"Orebfuscator",icon:"images/mods/orebfuscator.webp",descAr:"يحمي السيرفر من X-Ray.",descEn:"Blocks X-Ray cheats.",video:""},
{nameAr:"مود الانتقال لمكان عشوائي",nameEn:"RandomTP",icon:"images/mods/randomtp.webp",descAr:"ينقلك لمكان عشوائي.",descEn:"Teleport to a random location.",video:""},
{nameAr:"مود تجميع الموبات",nameEn:"RoseStacker",icon:"images/mods/rosestacker.webp",descAr:"يجمع الموبات لتقليل اللاج.",descEn:"Stacks mobs to reduce lag.",video:""},
{nameAr:"مود تعيين المنزل",nameEn:"SetHome",icon:"images/mods/sethome.webp",descAr:"احفظ منزلك والعودة إليه.",descEn:"Set and teleport to homes.",video:""},
{nameAr:"مود السكينات",nameEn:"SkinsRestorer",icon:"images/mods/skinsrestorer.webp",descAr:"إظهار السكينات للأوفلاين.",descEn:"Restores player skins.",video:""},
{nameAr:"مود ربط الشوب بالسباونرات",nameEn:"SpawnerShopBridge",icon:"images/mods/spawnershopbridge.webp",descAr:"ربط السباونرات بالشوب.",descEn:"Links spawners with the shop.",video:""},
{nameAr:"مود تسهيل قطع الأشجار",nameEn:"Timber",icon:"images/mods/timber.webp",descAr:"قطع الشجرة بالكامل بضربة واحدة.",descEn:"Break an entire tree at once.",video:""},
{nameAr:"مود تكسير الموارد بسهولة",nameEn:"VeinMiner",icon:"images/mods/veinminer.webp",descAr:"يكسر كامل العرق المعدني مرة واحدة.",descEn:"Mine an entire ore vein.",video:""},
{nameAr:"مود دعم جميع الإصدارات",nameEn:"ViaVersion",icon:"images/mods/viaversion.webp",descAr:"يسمح بدخول جميع الإصدارات.",descEn:"Supports multiple Minecraft versions.",video:""},
{nameAr:"مود الدردشة الصوتية",nameEn:"Simple Voice Chat",icon:"images/mods/voicechat.webp",descAr:"دردشة صوتية داخل السيرفر.",descEn:"In-game voice chat.",video:""}
];
const currentLang=localStorage.getItem("lang")||"ar";
const container=document.getElementById("mods-container");
function renderMods(){
container.innerHTML="";
mods.forEach(mod=>{
container.innerHTML+=`
<div class="mod-card">
<div class="mod-header">
<img src="${mod.icon}" class="mod-icon" alt="${mod.nameEn}">
<div class="mod-text">
<h3>${currentLang==="ar"?mod.nameAr:mod.nameEn}</h3>
<p>${currentLang==="ar"?mod.descAr:mod.descEn}</p>
</div>
</div>
<a href="${mod.video}" target="_blank" class="minecraft-btn">🎥 ${currentLang==="ar"?"مشاهدة الشرح":"Watch Tutorial"}</a>
</div>`;
});
}
function toggleMenu(){
document.getElementById("sideMenu").classList.toggle("active");
document.getElementById("menuOverlay").classList.toggle("active");
}
window.addEventListener("scroll",()=>{
const progress=document.getElementById("scroll-progress");
const max=document.documentElement.scrollHeight-window.innerHeight;
progress.style.width=(window.scrollY/max*100)+"%";
});
renderMods();
</script>
<style>
.mods-page{width:100%;display:flex;justify-content:center}
#mods-container{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.mod-card{background:linear-gradient(180deg,rgba(22,37,59,.95),rgba(10,20,36,.95));border:2px solid rgba(212,175,55,.25);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:18px}
.mod-header{display:flex;align-items:center;gap:14px}
.mod-icon{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0}
.mod-text{flex:1}
.mod-text h3{margin:0 0 6px;color:#55ff55;font-size:1.25rem;font-family:'MojangBold','Mojangles',sans-serif}
.mod-text p{margin:0;color:#ddd;line-height:1.5}
.mod-card .minecraft-btn{margin-top:auto}
@media(max-width:768px){
#mods-container{grid-template-columns:1fr}
.mod-icon{width:56px;height:56px}
.mod-text h3{font-size:1.1rem}
}
</style>
</body>
</html>
